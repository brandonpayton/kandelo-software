name: Publish Kandelo software

on:
  workflow_dispatch:
    inputs:
      kandelo-ref:
        description: Kandelo git ref to build against. Empty uses kandelo-abi.json source metadata.
        type: string
        default: ""
      kandelo-repository:
        description: Kandelo repository to build against. Empty uses kandelo-abi.json source metadata.
        type: string
        default: ""
      packages:
        description: "Package list: all, or comma-separated names."
        type: string
        default: all
      release-tag:
        description: Optional release tag override. Leave empty for binaries-abi-v<ABI>.
        type: string
        default: ""
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      kandelo_repository: ${{ steps.inputs.outputs.kandelo_repository }}
      kandelo_ref: ${{ steps.inputs.outputs.kandelo_ref }}
      packages: ${{ steps.inputs.outputs.packages }}
      release_tag: ${{ steps.inputs.outputs.release_tag }}
    steps:
      - name: Checkout kandelo-software
        uses: actions/checkout@v4

      - name: Resolve publish inputs
        id: inputs
        env:
          INPUT_KANDELO_REF: ${{ inputs.kandelo-ref || '' }}
          INPUT_KANDELO_REPOSITORY: ${{ inputs.kandelo-repository || '' }}
          INPUT_PACKAGES: ${{ inputs.packages || 'all' }}
          INPUT_RELEASE_TAG: ${{ inputs.release-tag || '' }}
        run: |
          bash scripts/resolve-publish-inputs.sh \
            --kandelo-ref "$INPUT_KANDELO_REF" \
            --kandelo-repository "$INPUT_KANDELO_REPOSITORY" \
            --packages "$INPUT_PACKAGES" \
            --release-tag "$INPUT_RELEASE_TAG"

  publish:
    needs: resolve
    uses: ./.github/workflows/reusable-publish.yml
    with:
      kandelo-repository: ${{ needs.resolve.outputs.kandelo_repository }}
      kandelo-ref: ${{ needs.resolve.outputs.kandelo_ref }}
      packages: ${{ needs.resolve.outputs.packages }}
      release-tag: ${{ needs.resolve.outputs.release_tag }}
